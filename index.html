<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UIL Number Sense — Adaptive Speed Trainer</title>
    <script>
      (function () {
        var cdn = ["https://cdn", "jsdelivr", "net"].join(".");
        var katexBase = cdn + "/npm/katex@0.16.11/dist/";
        var geistBase = cdn + "/npm/geist@1.3.1/dist/fonts/";

        [
          katexBase + "katex.min.css",
          geistBase + "geist-sans/style.min.css",
          geistBase + "geist-mono/style.min.css"
        ].forEach(function (href) {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          document.head.appendChild(link);
        });

        var script = document.createElement("script");
        script.defer = true;
        script.src = katexBase + "katex.min.js";
        document.head.appendChild(script);
      })();
    </script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #fafafa;
        color: #09090b;
        letter-spacing: -0.02em;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, strong {
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
        letter-spacing: -0.03em;
      }
      button, input {
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
        letter-spacing: -0.015em;
      }
      input:focus, button:focus {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
