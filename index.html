<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UIL Number Sense — Adaptive Speed Trainer</title>
    <script>
      (function () {
        var fontHost = ["https://api", "fontshare", "com"].join(".");
        var satoshiLink = document.createElement("link");
        satoshiLink.rel = "stylesheet";
        satoshiLink.href = fontHost + "/v2/css?f[]=satoshi@300,400,500,700,900,1&display=swap";
        document.head.appendChild(satoshiLink);

        var cdn = ["https://cdn", "jsdelivr", "net"].join(".");
        var katexBase = cdn + "/npm/katex@0.16.11/dist/";
        var katexLink = document.createElement("link");
        katexLink.rel = "stylesheet";
        katexLink.href = katexBase + "katex.min.css";
        document.head.appendChild(katexLink);

        var katexScript = document.createElement("script");
        katexScript.defer = true;
        katexScript.src = katexBase + "katex.min.js";
        document.head.appendChild(katexScript);
      })();
    </script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body, button, input, label, select, textarea {
        font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 600;
        font-variation-settings: 'wght' 600;
      }
      body {
        margin: 0;
        background-color: #fafafa;
        color: #09090b;
        letter-spacing: -0.015em;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, strong {
        font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 900;
        font-variation-settings: 'wght' 700;
        letter-spacing: -0.025em;
      }
      input:focus, button:focus {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
